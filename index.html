<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Process Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--fg:#1b2631;--muted:#5b6876;--line:#cdd5dd;--accent:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#141b22;--panel:#1d2731;--fg:#e8edf2;--muted:#9aa8b6;--line:#33424f;--accent:#e0b52c;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:700 clamp(28px,5vw,40px)/1.1 "Barlow Semi Condensed",sans-serif;margin:0}
p{margin:0;color:var(--muted)}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:16px 18px}
a.card b{font:600 22px "Barlow Semi Condensed",sans-serif;display:block}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body><main>
<h1>Process Lab</h1>
<p>Watch a process, describe it, write it up. Choose the exercise your teacher gave you.</p>
<a class="card" href="/claus/"><b>The Claus process</b><span>Sulfur recovery plant, seven stations.</span></a>
</main></body></html>
